[package]
name = "wissenszentrum"
version = "1.1.0"
description = "Wissenszentrum – All-in-One Dokumentations- und Verwaltungstool"
authors = ["Armin"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "wissenszentrum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
